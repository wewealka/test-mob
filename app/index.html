<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Get Unlimited Access</title>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <a href="#" class="close-btn">
          <img src="assets/svg/close.svg" width="24" height="24" alt="Close" />
        </a>
      </header>

      <main class="content">
        <h1 class="main-title" data-key="main_title">
          Get Unlimited<br />Access
        </h1>

        <div class="features-grid">
          <div class="feature-item">
            <img src="assets/img/i1.jpg" alt="Unlimited Art Creation" />
            <p class="feature-text" data-key="feature_1">
              Unlimited Art<br />Creation
            </p>
          </div>
          <div class="feature-item">
            <img src="assets/img/i2.jpg" alt="Exclusive Styles" />
            <p class="feature-text" data-key="feature_2">
              Exclusive<br />Styles
            </p>
          </div>
          <div class="feature-item">
            <img src="assets/img/i3.jpg" alt="Magic Avatars" />
            <p class="feature-text" data-key="feature_3">
              Magic Avatars<br />With 20% Off
            </p>
          </div>
        </div>

        <div class="plans">
          <a href="#" class="plan-button yearly-plan selected">
            <div class="best-offer" data-key="best_offer">BEST OFFER</div>
            <div class="plan-details">
              <span class="plan-title" data-key="yearly_access"
                >YEARLY ACCESS</span
              >
              <span class="plan-price-year" data-key="price_yearly_description"
                >Just $39.99 per year</span
              >
            </div>
            <div class="plan-price-weekly">
              <span class="price-amount">$0.48</span>
              <span class="price-period" data-key="per_week">per week</span>
            </div>
          </a>

          <a href="#" class="plan-button weekly-plan">
            <div class="plan-details">
              <span class="plan-title" data-key="weekly_access"
                >WEEKLY ACCESS</span
              >
            </div>
            <div class="plan-price-weekly">
              <span class="price-amount">$6.99</span>
              <span class="price-period" data-key="per_week">per week</span>
            </div>
          </a>
        </div>

        <a href="#" class="continue-btn" data-key="continue_button">Continue</a>
        <footer class="footer">
          <a href="#" data-key="terms">Terms of Use</a>
          <a href="#" data-key="privacy">Privacy Policy</a>
          <a href="#" data-key="restore">Restore</a>
        </footer>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
